<!DOCTYPE html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="img/favicon.png" type="image/x-icon" />
    <link rel="stylesheet" href="style.css" />
    <!-- Skripte einbinden -->
    <script src="models/sound-manager.class.js"></script>
    <script src="models/drawable-object.class.js"></script>
    <script src="models/movable-object.class.js"></script>
    <script src="models/character.class.js"></script>
    <script src="models/chicken.class.js"></script>
    <script src="models/bottle.class.js"></script>
    <script src="models/status-bar-health.class.js"></script>
    <script src="models/status-bar-coins.class.js"></script>
    <script src="models/status-bar-bottles.class.js"></script>
    <script src="models/world.class.js"></script>
    <script src="models/cloud.class.js"></script>
    <script src="models/coin.class.js"></script>
    <script src="models/background-object.class.js"></script>
    <script src="models/keyboard.class.js"></script>
    <script src="models/level.class.js"></script>
    <script src="models/throwable-object.class.js"></script>
    <script src="models/endboss.class.js"></script>
    <script src="models/startscreen.class.js"></script>
    <script src="levels/level1.js"></script>
    <script src="js/game.js"></script>
    <title>El Pollo Loco</title>
  </head>
  <body onload="init()">
    <div id="fullscreen">
      <canvas id="canvas" width="720" height="480"></canvas>
    </div>
    <div id="mobileImpressumLink">
      <a href="impressum.html">Impressum</a>
    </div>

    <div id="touchControls" style="display: none">
      <div id="leftControls">
        <button id="btnLeft">←</button>
        <button id="btnRight">→</button>
      </div>
      <div id="rightControls">
        <button id="btnJump">Jump</button>
        <button id="btnThrow">Throw</button>
      </div>
      <button id="btnMute" title="Mute">🔇</button>
    </div>

    <div id="orientationOverlay" style="display: none">
      <p>Bitte drehen Sie Ihr Gerät in den Querformatmodus, um zu spielen!</p>
    </div>

    <footer id="desktopImpressum">
      <nav>
        <a href="impressum.html">Impressum</a>
      </nav>
    </footer>
    <!-- Restart-Button für Mobile (sichtbar nach Game Over oder Victory) -->
    <button id="restartButton" style="display: none" class="explanationButton">
      🔁 Neu starten
    </button>
  </body>
</html>
